<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal ESFOT - Verificación de Acceso</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <!-- Header / Branding -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-600/20 border border-indigo-500/30 text-indigo-400 mb-3 shadow-lg shadow-indigo-500/10">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white">ESFOT Learning Routes</h1>
      <p class="text-sm text-slate-400 mt-1">Portal institucional de autenticación</p>
    </div>

    <!-- Card Contenedor -->
    <div class="bg-slate-800/80 backdrop-blur-xl border border-slate-700/60 rounded-2xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">

      <!-- Pestañas (Login / Registro) -->
      <div id="tabsContainer" class="flex border-b border-slate-700 mb-6 pb-2 space-x-6 text-sm font-medium">
        <button id="tabLoginBtn" type="button" class="text-indigo-400 border-b-2 border-indigo-500 pb-2 transition-colors">
          Iniciar Sesión
        </button>
        <button id="tabRegisterBtn" type="button" class="text-slate-400 hover:text-slate-200 pb-2 transition-colors">
          Registrar Estudiante
        </button>
      </div>

      <!-- Alertas Globales -->
      <div id="alertBox" class="hidden mb-6 p-4 rounded-xl text-sm border flex items-start gap-3 transition-all" role="alert">
        <span id="alertIcon" class="mt-0.5 font-bold"></span>
        <div id="alertMessage" class="flex-1 text-sm font-medium"></div>
      </div>

      <!-- ── VISTA 1: FORMULARIO DE LOGIN DIRECTO ── -->
      <form id="loginForm" class="space-y-4">
        <div>
          <label for="loginEmail" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">
            Correo Institucional (@epn.edu.ec)
          </label>
          <input 
            type="email" 
            id="loginEmail" 
            name="email"
            value="admin@epn.edu.ec"
            required
            autocomplete="email"
            placeholder="usuario@epn.edu.ec" 
            class="w-full px-4 py-2.5 rounded-xl bg-slate-900/80 border border-slate-700 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-slate-100 placeholder-slate-500 text-sm outline-none transition"
          >
        </div>

        <div>
          <label for="loginPassword" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">
            Contraseña
          </label>
          <input 
            type="password" 
            id="loginPassword" 
            name="password"
            value="SuperAdmin2026*"
            required
            autocomplete="current-password"
            placeholder="••••••••••••" 
            class="w-full px-4 py-2.5 rounded-xl bg-slate-900/80 border border-slate-700 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-slate-100 placeholder-slate-500 text-sm outline-none transition"
          >
        </div>

        <button 
          type="submit" 
          id="btnLoginSubmit"
          class="w-full mt-2 py-3 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm transition-all shadow-lg shadow-indigo-600/20 flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <span>Iniciar Sesión</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
          </svg>
        </button>
      </form>

      <!-- ── VISTA 2: PERFIL AUTENTICADO ── -->
      <div id="profileSection" class="hidden space-y-4">
        <div class="p-4 rounded-xl bg-slate-900/90 border border-slate-700 space-y-3">
          <div class="flex items-center justify-between pb-3 border-b border-slate-800">
            <div>
              <h2 id="profileName" class="text-base font-semibold text-white"></h2>
              <p id="profileEmail" class="text-xs text-slate-400"></p>
            </div>
            <span id="profileRoleBadge" class="px-2.5 py-1 text-xs font-semibold rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30"></span>
          </div>

          <div class="grid grid-cols-3 gap-2 text-center pt-1 text-xs">
            <div class="bg-slate-800/60 p-2 rounded-lg border border-slate-700/50">
              <span class="text-slate-400 block text-[10px] uppercase">Nivel</span>
              <span id="profileLevel" class="font-bold text-white text-sm">1</span>
            </div>
            <div class="bg-slate-800/60 p-2 rounded-lg border border-slate-700/50">
              <span class="text-slate-400 block text-[10px] uppercase">XP Total</span>
              <span id="profileXP" class="font-bold text-amber-400 text-sm">0</span>
            </div>
            <div class="bg-slate-800/60 p-2 rounded-lg border border-slate-700/50">
              <span class="text-slate-400 block text-[10px] uppercase">Racha</span>
              <span id="profileStreak" class="font-bold text-emerald-400 text-sm">0 d</span>
            </div>
          </div>
        </div>

        <div class="bg-slate-900/50 border border-slate-800 p-3 rounded-xl">
          <label class="block text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1">
            JWT Token (Bearer):
          </label>
          <div id="profileTokenPreview" class="text-[11px] font-mono text-slate-400 break-all select-all bg-slate-950/80 p-2 rounded border border-slate-800 max-h-20 overflow-y-auto"></div>
        </div>

        <button 
          type="button" 
          id="btnLogout"
          class="w-full py-2.5 px-4 rounded-xl bg-rose-600/20 hover:bg-rose-600/30 text-rose-300 border border-rose-500/30 text-sm font-medium transition cursor-pointer"
        >
          Cerrar Sesión
        </button>
      </div>

      <!-- ── VISTA 4: FORMULARIO DE REGISTRO DE ESTUDIANTE ── -->
      <form id="registerForm" class="hidden space-y-4">
        <div>
          <label for="regName" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">
            Nombre Completo
          </label>
          <input 
            type="text" 
            id="regName" 
            required
            placeholder="Estudiante Ejemplo" 
            class="w-full px-4 py-2.5 rounded-xl bg-slate-900/80 border border-slate-700 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-slate-100 placeholder-slate-500 text-sm outline-none transition"
          >
        </div>

        <div>
          <label for="regEmail" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">
            Correo Institucional (@epn.edu.ec)
          </label>
          <input 
            type="email" 
            id="regEmail" 
            required
            placeholder="estudiante@epn.edu.ec" 
            class="w-full px-4 py-2.5 rounded-xl bg-slate-900/80 border border-slate-700 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-slate-100 placeholder-slate-500 text-sm outline-none transition"
          >
        </div>

        <div>
          <label for="regPassword" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">
            Contraseña (Mínimo 8 caracteres)
          </label>
          <input 
            type="password" 
            id="regPassword" 
            required
            minlength="8"
            placeholder="••••••••••••" 
            class="w-full px-4 py-2.5 rounded-xl bg-slate-900/80 border border-slate-700 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-slate-100 placeholder-slate-500 text-sm outline-none transition"
          >
        </div>

        <button 
          type="submit" 
          id="btnRegisterSubmit"
          class="w-full mt-2 py-3 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm transition-all shadow-lg shadow-indigo-600/20 flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50"
        >
          <span>Registrar Cuenta</span>
        </button>
      </form>

    </div>

    <!-- Footer Status -->
    <div class="text-center mt-6 text-xs text-slate-500 flex items-center justify-center gap-2">
      <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
      <span>Conectado a Turso Cloud & Neo4j AuraDB</span>
    </div>
  </div>

  <!-- Script con buenas prácticas de Frontend Security Coder -->
  <script>
    (function() {
      'use strict';

      // ── Estado en memoria ──────────────────────────────────────────────────
      let currentCredentials = { email: '', password: '' };
      let authToken = sessionStorage.getItem('token') || '';

      // ── Elementos del DOM ──────────────────────────────────────────────────
      const alertBox = document.getElementById('alertBox');
      const alertIcon = document.getElementById('alertIcon');
      const alertMessage = document.getElementById('alertMessage');

      const tabsContainer = document.getElementById('tabsContainer');
      const tabLoginBtn = document.getElementById('tabLoginBtn');
      const tabRegisterBtn = document.getElementById('tabRegisterBtn');

      const loginForm = document.getElementById('loginForm');
      const loginEmail = document.getElementById('loginEmail');
      const loginPassword = document.getElementById('loginPassword');
      const btnLoginSubmit = document.getElementById('btnLoginSubmit');

      const profileSection = document.getElementById('profileSection');
      const profileName = document.getElementById('profileName');
      const profileEmail = document.getElementById('profileEmail');
      const profileRoleBadge = document.getElementById('profileRoleBadge');
      const profileLevel = document.getElementById('profileLevel');
      const profileXP = document.getElementById('profileXP');
      const profileStreak = document.getElementById('profileStreak');
      const profileTokenPreview = document.getElementById('profileTokenPreview');
      const btnLogout = document.getElementById('btnLogout');

      const registerForm = document.getElementById('registerForm');
      const regName = document.getElementById('regName');
      const regEmail = document.getElementById('regEmail');
      const regPassword = document.getElementById('regPassword');
      const btnRegisterSubmit = document.getElementById('btnRegisterSubmit');

      // ── Utilidades Seguras (textContent para prevención de XSS) ───────────
      function showAlert(type, text) {
        alertBox.className = 'mb-6 p-4 rounded-xl text-sm border flex items-start gap-3 transition-all';
        if (type === 'error') {
          alertBox.classList.add('bg-rose-500/10', 'border-rose-500/30', 'text-rose-300');
          alertIcon.textContent = '✕';
        } else if (type === 'warning') {
          alertBox.classList.add('bg-amber-500/10', 'border-amber-500/30', 'text-amber-300');
          alertIcon.textContent = '⚠';
        } else if (type === 'success') {
          alertBox.classList.add('bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-300');
          alertIcon.textContent = '✓';
        }
        alertMessage.textContent = text;
        alertBox.classList.remove('hidden');
      }

      function hideAlert() {
        alertBox.classList.add('hidden');
        alertMessage.textContent = '';
      }

      function setView(view) {
        hideAlert();
        loginForm.classList.add('hidden');
        profileSection.classList.add('hidden');
        registerForm.classList.add('hidden');
        tabsContainer.classList.add('hidden');

        if (view === 'login') {
          loginForm.classList.remove('hidden');
          tabsContainer.classList.remove('hidden');
          tabLoginBtn.className = 'text-indigo-400 border-b-2 border-indigo-500 pb-2 transition-colors';
          tabRegisterBtn.className = 'text-slate-400 hover:text-slate-200 pb-2 transition-colors';
        } else if (view === 'profile') {
          profileSection.classList.remove('hidden');
        } else if (view === 'register') {
          registerForm.classList.remove('hidden');
          tabsContainer.classList.remove('hidden');
          tabRegisterBtn.className = 'text-indigo-400 border-b-2 border-indigo-500 pb-2 transition-colors';
          tabLoginBtn.className = 'text-slate-400 hover:text-slate-200 pb-2 transition-colors';
        }
      }

      // ── Cargar Perfil si ya hay sesión ────────────────────────────────────
      async function loadProfile() {
        if (!authToken) return setView('login');

        try {
          const res = await fetch('/api/auth/profile', {
            headers: { 'Authorization': 'Bearer ' + authToken }
          });

          if (!res.ok) {
            sessionStorage.removeItem('token');
            authToken = '';
            return setView('login');
          }

          const user = await res.json();
          profileName.textContent = user.name || 'Usuario';
          profileEmail.textContent = user.email || '';
          profileRoleBadge.textContent = (user.roles && user.roles.join(', ')) || 'ESTUDIANTE';
          profileLevel.textContent = user.level || 1;
          profileXP.textContent = user.xp || 0;
          profileStreak.textContent = (user.streak || 0) + ' d';
          profileTokenPreview.textContent = authToken;

          setView('profile');
        } catch (err) {
          setView('login');
        }
      }

      // ── Evento: Enviar Login Directo ──────────────────────────────────────
      loginForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        hideAlert();

        const email = loginEmail.value.trim();
        const password = loginPassword.value;

        if (!email || !password) {
          showAlert('error', 'Por favor ingresa correo y contraseña.');
          return;
        }

        currentCredentials = { email, password };
        btnLoginSubmit.disabled = true;
        btnLoginSubmit.querySelector('span').textContent = 'Ingresando...';

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });

          const data = await res.json();

          if (res.ok && data.token) {
            authToken = data.token;
            sessionStorage.setItem('token', authToken);
            showAlert('success', 'Sesión iniciada correctamente.');
            await loadProfile();
          } else {
            showAlert('error', data.message || data.error || 'Credenciales incorrectas.');
          }
        } catch (err) {
          showAlert('error', 'Error al conectar con el servidor.');
        } finally {
          btnLoginSubmit.disabled = false;
          btnLoginSubmit.querySelector('span').textContent = 'Iniciar Sesión';
        }
      });

      // ── Evento: Registro ──────────────────────────────────────────────────
      registerForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        hideAlert();

        const name = regName.value.trim();
        const email = regEmail.value.trim();
        const password = regPassword.value;

        if (!email.endsWith('@epn.edu.ec')) {
          showAlert('error', 'El correo debe ser institucional (@epn.edu.ec).');
          return;
        }

        btnRegisterSubmit.disabled = true;
        btnRegisterSubmit.querySelector('span').textContent = 'Registrando...';

        try {
          const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, password })
          });

          const data = await res.json();

          if (res.ok) {
            showAlert('success', data.message || 'Usuario creado. Ahora puedes iniciar sesión.');
            registerForm.reset();
            setTimeout(() => setView('login'), 2000);
          } else {
            showAlert('error', data.error || data.message || 'Error al registrar.');
          }
        } catch (err) {
          showAlert('error', 'Error de conexión con el servidor.');
        } finally {
          btnRegisterSubmit.disabled = false;
          btnRegisterSubmit.querySelector('span').textContent = 'Registrar Cuenta';
        }
      });

      // ── Pestañas & Logout ─────────────────────────────────────────────────
      tabLoginBtn.addEventListener('click', () => setView('login'));
      tabRegisterBtn.addEventListener('click', () => setView('register'));

      btnLogout.addEventListener('click', function() {
        sessionStorage.removeItem('token');
        authToken = '';
        currentCredentials = { email: '', password: '' };
        showAlert('success', 'Sesión cerrada correctamente.');
        setView('login');
      });

      // Inicializar
      loadProfile();
    })();
  </script>
</body>
</html>
