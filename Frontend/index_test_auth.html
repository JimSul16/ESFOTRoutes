<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba de Autenticación & Registro ESFOT</title>
  <!-- Tailwind CSS para diseño limpio sin instalar nada -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white p-6 sm:p-8 rounded-xl shadow-md w-full max-w-md border border-gray-200">
    <h1 class="text-xl font-bold text-gray-800 text-center mb-1">Pruebas ESFOT - Turso & 2FA</h1>
    <p class="text-xs text-gray-500 text-center mb-4">Backend: <span class="font-mono text-blue-600">http://localhost:3000</span></p>

    <!-- Pestañas para alternar entre Login y Registro -->
    <div class="flex border-b border-gray-200 mb-5 text-sm font-semibold">
      <button id="tabLogin" class="flex-1 py-2 text-blue-600 border-b-2 border-blue-600 transition">Iniciar Sesión</button>
      <button id="tabRegister" class="flex-1 py-2 text-gray-400 hover:text-gray-600 transition">Registrar Nuevo</button>
    </div>

    <!-- Caja de mensajes / Alertas -->
    <div id="mensaje" class="hidden p-3 rounded-lg text-xs mb-4 font-medium leading-relaxed"></div>

    <!-- ── VISTA 1: FORMULARIO DE LOGIN ── -->
    <div id="vistaLogin">
      <div id="pasoLoginCredenciales" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Correo Electrónico</label>
          <input 
            type="email" 
            id="inputEmail" 
            value="jimmito636@gmail.com" 
            placeholder="usuario@epn.edu.ec o @gmail.com" 
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none"
          >
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Contraseña</label>
          <input 
            type="password" 
            id="inputPassword" 
            value="SuperAdmin2026*" 
            placeholder="••••••••" 
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none"
          >
        </div>

        <button 
          id="btnEnviarCredenciales" 
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg text-sm transition cursor-pointer"
        >
          Iniciar Sesión
        </button>
      </div>

      <!-- PASO 2: Verificación de OTP (Aparece al responder 206) -->
      <div id="pasoOtp" class="hidden space-y-4">
        <div class="bg-amber-50 border border-amber-200 p-3 rounded-lg text-xs text-amber-900 leading-relaxed">
          🔒 <strong>2FA Activado:</strong> Se requiere el código de verificación de 6 dígitos generado en el backend.
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase mb-1 text-center">Código OTP</label>
          <input 
            type="text" 
            id="inputOtp" 
            maxlength="6" 
            placeholder="000000" 
            class="w-full text-center tracking-widest text-2xl font-mono py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none text-green-700"
          >
        </div>

        <button 
          id="btnValidarOtp" 
          class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-2 rounded-lg text-sm transition cursor-pointer"
        >
          Validar Código OTP
        </button>

        <button 
          id="btnVolverLogin" 
          class="w-full text-xs text-gray-500 hover:text-gray-700 py-1"
        >
          ← Volver a ingresar contraseña
        </button>
      </div>
    </div>

    <!-- ── VISTA 2: FORMULARIO DE REGISTRO ── -->
    <div id="vistaRegister" class="hidden space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Nombre Completo</label>
        <input 
          type="text" 
          id="regNombre" 
          placeholder="Juan Pérez" 
          class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none"
        >
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Correo Electrónico (@epn.edu.ec o @gmail.com)</label>
        <input 
          type="email" 
          id="regEmail" 
          placeholder="usuario@epn.edu.ec o @gmail.com" 
          class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none"
        >
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Contraseña (Mínimo 8 caracteres)</label>
        <input 
          type="password" 
          id="regPassword" 
          placeholder="••••••••" 
          class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none"
        >
      </div>

      <button 
        id="btnRegistrarUsuario" 
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg text-sm transition cursor-pointer"
      >
        Registrar en la BD
      </button>
    </div>

    <!-- ── VISTA 3: SESIÓN INICIADA (PERFIL) ── -->
    <div id="vistaPerfil" class="hidden space-y-4">
      <div class="p-4 bg-green-50 border border-green-200 rounded-lg">
        <h2 class="text-sm font-bold text-green-900 mb-2">¡Sesión Activa en Turso!</h2>
        <p class="text-xs text-gray-700 mb-1"><strong>Nombre:</strong> <span id="perfilNombre"></span></p>
        <p class="text-xs text-gray-700 mb-1"><strong>Email:</strong> <span id="perfilEmail"></span></p>
        <p class="text-xs text-gray-700"><strong>Roles:</strong> <span id="perfilRol" class="bg-blue-100 text-blue-800 px-2 py-0.5 rounded text-[10px] font-bold"></span></p>
      </div>

      <div class="bg-gray-50 border border-gray-200 p-3 rounded-lg">
        <span class="block text-[10px] font-semibold text-gray-500 uppercase mb-1">Token JWT Emitido:</span>
        <div id="perfilToken" class="text-[10px] font-mono text-gray-600 break-all max-h-20 overflow-y-auto bg-white p-2 border rounded"></div>
      </div>

      <!-- Historial de Auditoría de Sesiones en Turso -->
      <div class="bg-gray-50 border border-gray-200 p-3 rounded-lg">
        <div class="flex items-center justify-between mb-2">
          <span class="text-[11px] font-bold text-gray-700 uppercase">Historial de Accesos (Turso DB):</span>
          <span class="text-[10px] text-emerald-600 font-semibold">● Auditoría activa</span>
        </div>
        <div id="listaSesiones" class="space-y-1.5 max-h-48 overflow-y-auto">
          <p class="text-[11px] text-gray-400">Cargando sesiones...</p>
        </div>
      </div>

      <button 
        id="btnCerrarSesion" 
        class="w-full bg-red-600 hover:bg-red-700 text-white font-medium py-2 rounded-lg text-sm transition cursor-pointer"
      >
        Cerrar Sesión
      </button>
    </div>

  </div>

  <script>
    const API_URL = "http://localhost:3000/api/auth";

    let credenciales = { email: "", password: "" };
    let tokenJwt = "";

    const mensaje = document.getElementById("mensaje");
    const tabLogin = document.getElementById("tabLogin");
    const tabRegister = document.getElementById("tabRegister");

    const vistaLogin = document.getElementById("vistaLogin");
    const pasoLoginCredenciales = document.getElementById("pasoLoginCredenciales");
    const pasoOtp = document.getElementById("pasoOtp");
    const vistaRegister = document.getElementById("vistaRegister");
    const vistaPerfil = document.getElementById("vistaPerfil");

    const inputEmail = document.getElementById("inputEmail");
    const inputPassword = document.getElementById("inputPassword");
    const inputOtp = document.getElementById("inputOtp");

    const regNombre = document.getElementById("regNombre");
    const regEmail = document.getElementById("regEmail");
    const regPassword = document.getElementById("regPassword");

    const perfilNombre = document.getElementById("perfilNombre");
    const perfilEmail = document.getElementById("perfilEmail");
    const perfilRol = document.getElementById("perfilRol");
    const perfilToken = document.getElementById("perfilToken");

    function mostrarMensaje(tipo, texto) {
      mensaje.className = "p-3 rounded-lg text-xs mb-4 font-medium leading-relaxed " + 
        (tipo === "error" ? "bg-red-100 text-red-700 border border-red-200" :
         tipo === "aviso" ? "bg-amber-100 text-amber-800 border border-amber-200" :
         "bg-green-100 text-green-700 border border-green-200");
      mensaje.textContent = texto;
      mensaje.classList.remove("hidden");
    }

    function ocultarMensaje() {
      mensaje.classList.add("hidden");
    }

    // Pestañas
    tabLogin.addEventListener("click", () => {
      ocultarMensaje();
      tabLogin.className = "flex-1 py-2 text-blue-600 border-b-2 border-blue-600 transition";
      tabRegister.className = "flex-1 py-2 text-gray-400 hover:text-gray-600 transition";
      vistaLogin.classList.remove("hidden");
      vistaRegister.classList.add("hidden");
    });

    tabRegister.addEventListener("click", () => {
      ocultarMensaje();
      tabRegister.className = "flex-1 py-2 text-indigo-600 border-b-2 border-indigo-600 transition";
      tabLogin.className = "flex-1 py-2 text-gray-400 hover:text-gray-600 transition";
      vistaRegister.classList.remove("hidden");
      vistaLogin.classList.add("hidden");
      pasoOtp.classList.add("hidden");
      pasoLoginCredenciales.classList.remove("hidden");
    });

    // 1. Iniciar Sesión (Paso 1)
    document.getElementById("btnEnviarCredenciales").addEventListener("click", async () => {
      ocultarMensaje();
      credenciales.email = inputEmail.value.trim();
      credenciales.password = inputPassword.value;

      if (!credenciales.email || !credenciales.password) {
        mostrarMensaje("error", "Por favor ingresa correo y contraseña.");
        return;
      }

      try {
        const res = await fetch(`${API_URL}/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(credenciales)
        });

        const data = await res.json();

        if (res.status === 206) {
          mostrarMensaje("aviso", data.message || "Código OTP requerido. Revisa la terminal o tu correo.");
          pasoLoginCredenciales.classList.add("hidden");
          pasoOtp.classList.remove("hidden");
          inputOtp.value = "";
          inputOtp.focus();
        } else if (res.status === 429) {
          mostrarMensaje("aviso", "⏳ " + (data.error || "Cuenta bloqueada temporalmente por 15 minutos."));
        } else if (res.status === 403) {
          mostrarMensaje("error", "🚨 " + (data.error || "Cuenta bloqueada permanentemente. Notificado al Administrador."));
        } else {
          mostrarMensaje("error", data.message || data.error || "Credenciales incorrectas.");
        }
      } catch (err) {
        mostrarMensaje("error", "No se pudo conectar al backend (http://localhost:3000).");
      }
    });

    // 2. Validar OTP (Paso 2)
    document.getElementById("btnValidarOtp").addEventListener("click", async () => {
      ocultarMensaje();
      const otp = inputOtp.value.trim();

      if (!otp || otp.length !== 6) {
        mostrarMensaje("error", "El código OTP debe ser de 6 dígitos.");
        return;
      }

      try {
        const res = await fetch(`${API_URL}/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: credenciales.email,
            password: credenciales.password,
            otp: otp
          })
        });

        const data = await res.json();

        if (res.ok && data.token) {
          mostrarMensaje("exito", "¡Código OTP verificado con éxito!");
          completarLogin(data.token);
        } else if (res.status === 429) {
          mostrarMensaje("aviso", "⏳ " + (data.error || "Cuenta bloqueada temporalmente por 15 minutos."));
        } else if (res.status === 403) {
          mostrarMensaje("error", "🚨 " + (data.error || "Cuenta bloqueada permanentemente. Notificado al Administrador."));
        } else {
          mostrarMensaje("error", data.message || data.error || "Código OTP incorrecto o expirado.");
        }
      } catch (err) {
        mostrarMensaje("error", "Error de conexión al validar OTP.");
      }
    });

    document.getElementById("btnVolverLogin").addEventListener("click", () => {
      ocultarMensaje();
      pasoOtp.classList.add("hidden");
      pasoLoginCredenciales.classList.remove("hidden");
    });

    // 3. Registrar Nuevo Usuario
    document.getElementById("btnRegistrarUsuario").addEventListener("click", async () => {
      ocultarMensaje();
      const name = regNombre.value.trim();
      const email = regEmail.value.trim();
      const password = regPassword.value;

      if (!name || !email || !password) {
        mostrarMensaje("error", "Todos los campos son obligatorios.");
        return;
      }

      if (!email.endsWith("@epn.edu.ec") && !email.endsWith("@gmail.com")) {
        mostrarMensaje("error", "El correo debe terminar en @epn.edu.ec o @gmail.com");
        return;
      }

      if (password.length < 8) {
        mostrarMensaje("error", "La contraseña debe tener mínimo 8 caracteres.");
        return;
      }

      try {
        const res = await fetch(`${API_URL}/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email, password })
        });

        const data = await res.json();

        if (res.ok) {
          mostrarMensaje("exito", "✅ Usuario guardado en Turso: " + (data.message || "Registro exitoso."));
          regNombre.value = "";
          regEmail.value = "";
          regPassword.value = "";
        } else {
          mostrarMensaje("error", data.error || data.message || "Error al registrar.");
        }
      } catch (err) {
        mostrarMensaje("error", "Error de conexión con el backend.");
      }
    });

    // 4. Mostrar Perfil
    async function completarLogin(token) {
      tokenJwt = token;
      vistaLogin.classList.add("hidden");
      vistaRegister.classList.add("hidden");
      tabLogin.parentElement.classList.add("hidden");
      vistaPerfil.classList.remove("hidden");

      try {
        const res = await fetch(`${API_URL}/profile`, {
          headers: { "Authorization": `Bearer ${tokenJwt}` }
        });
        const usuario = await res.json();

        perfilNombre.textContent = usuario.name || "Usuario";
        perfilEmail.textContent = usuario.email || "";
        perfilRol.textContent = (usuario.roles && usuario.roles.join(", ")) || "STUDENT";
        perfilToken.textContent = tokenJwt;
      } catch (e) {
        perfilNombre.textContent = "Error al consultar perfil";
      }

      // Cargar historial de sesiones (Auditoría)
      try {
        const sesRes = await fetch(`${API_URL}/sessions`, {
          headers: { "Authorization": `Bearer ${tokenJwt}` }
        });
        const sesiones = await sesRes.json();
        const lista = document.getElementById("listaSesiones");
        lista.innerHTML = "";

        if (!Array.isArray(sesiones) || sesiones.length === 0) {
          lista.innerHTML = '<p class="text-[11px] text-gray-400 py-1">Sin registros previos.</p>';
        } else {
          sesiones.forEach(s => {
            const item = document.createElement("div");
            item.className = "bg-white p-2 rounded border border-gray-200 shadow-xs flex flex-col gap-0.5";
            const roleColor = s.role === 'ADMIN' ? 'bg-purple-100 text-purple-800' : 'bg-blue-100 text-blue-800';
            item.innerHTML = `
              <div class="flex items-center justify-between">
                <span class="font-semibold text-gray-800 text-[11px]">${escapeHtml(s.deviceInfo)}</span>
                <span class="${roleColor} text-[9px] font-bold px-1.5 py-0.5 rounded">${escapeHtml(s.role)}</span>
              </div>
              <div class="flex items-center justify-between text-[10px] text-gray-500">
                <span>IP: <strong class="font-mono text-gray-700">${escapeHtml(s.ipAddress)}</strong></span>
                <span>${new Date(s.createdAt).toLocaleString()}</span>
              </div>
            `;
            lista.appendChild(item);
          });
        }
      } catch (e) {
        document.getElementById("listaSesiones").innerHTML = '<p class="text-[11px] text-red-500">Error al cargar historial.</p>';
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // 5. Cerrar Sesión
    document.getElementById("btnCerrarSesion").addEventListener("click", () => {
      tokenJwt = "";
      credenciales = { email: "", password: "" };
      ocultarMensaje();
      vistaPerfil.classList.add("hidden");
      tabLogin.parentElement.classList.remove("hidden");
      tabLogin.click();
      pasoOtp.classList.add("hidden");
      pasoLoginCredenciales.classList.remove("hidden");
    });
  </script>
</body>
</html>
